bind: 127.0.0.1:8080
publicOrigin: http://127.0.0.1:1421
dataDir: .datatrip-web/dev
assetsDir: dist-web
workspaceKeyEnv: DATATRIP_WEB_WORKSPACE_KEY
auth:
  anonymous: true

