name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Ubuntu system packages needed by Tauri 2 (webkit2gtk 4.1 + tray/appindicator).
  # Only libayatana-appindicator3-dev is listed; libappindicator3-dev conflicts with it.
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    patchelf
    libdbus-1-dev
    pkg-config
    build-essential
    libssl-dev
    libgtk-3-dev
    cmake
    g++

jobs:
  check:
    name: Check (typecheck, build, cargo check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install npm dependencies
        run: npm install

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Frontend build
        run: npm run build

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Shared operation registration
        run: node scripts/check-operation-parity.mjs

      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # Installers are built only when asked for: a version tag (v*, also creates the draft
  # release), a manual run (Actions › release › Run workflow), or a push whose head commit
  # message contains "[build]". Every other push / PR only runs the quick check above.
  build:
    name: Build ${{ matrix.artifact-name }}
    needs: check
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[build]'))
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two parallel macOS builds instead of one universal build (which compiles both
          # architectures one after the other). The updater picks the matching one.
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            artifact-name: macos-apple-silicon
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            artifact-name: macos-intel
          - platform: windows-latest
            args: ""
            rust-targets: ""
            artifact-name: windows
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
            artifact-name: linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS

      # librdkafka (rdkafka "cmake-build") needs cmake. It is preinstalled on the macos-latest,
      # windows-latest and ubuntu-22.04 runner images; this step fails early if that ever changes.
      # Windows: vendored OpenSSL (openssl-src) needs Perl, which the windows-latest image ships
      # (Strawberry Perl); NASM is installed best-effort in case the OpenSSL build asks for it.
      - name: Check cmake
        run: cmake --version

      - name: Install NASM (Windows, for vendored OpenSSL)
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: choco install nasm -y --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install npm dependencies
        run: npm install

      # In-app updates: with the signing key secret present, builds also produce signed update
      # bundles and tauri-action attaches latest.json to the release. Without it, builds work as
      # before and the app's updater stays off.
      - name: Updater signing (when configured)
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          DATATRIP_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -n "$KEY" ]; then
            # The bundler reads the verification key from its merged config; the runtime
            # also receives the same key from the build environment.
            node --input-type=module <<'JS'
            import { readFileSync, writeFileSync } from "node:fs";
            const pubkey = process.env.DATATRIP_UPDATER_PUBKEY?.trim();
            if (!pubkey) throw new Error("TAURI_UPDATER_PUBKEY is required for signed updater artifacts");
            const config = JSON.parse(readFileSync("src-tauri/tauri.updater.conf.json", "utf8"));
            config.plugins = { updater: { pubkey } };
            writeFileSync("src-tauri/tauri.updater-ci.conf.json", JSON.stringify(config));
          JS
            echo "args=--config src-tauri/tauri.updater-ci.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY secret: building without update signatures."
          fi

      - name: Build and (for tags) draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Public key compiled into the app to verify downloaded updates (repository variable).
          DATATRIP_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'DataTrip v__VERSION__' || '' }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: datatrip-${{ matrix.artifact-name }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
