[package]
name = "datatrip"
version = "0.5.0"
description = "DataTrip - a fast, lightweight database IDE"
edition = "2021"
rust-version = "1.77"

[lib]
name = "datatrip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
datatrip-core = { path = "../crates/datatrip-core", features = ["desktop-keychain"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
keyring = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[profile.release]
opt-level = 3
# Thin LTO with parallel codegen: most of full LTO's benefit at a fraction of the build time.
lto = "thin"
codegen-units = 16
strip = true
