[package]
name = "datatrip-wasm"
version = "0.5.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
datatrip-import-format = { path = "../datatrip-import-format" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
